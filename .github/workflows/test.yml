name: Test

# Runs the typecheck and the test suite against the SuperDB release pinned in
# .superdb-version. Tests that need the `super` binary are skipped without it,
# so this is what exercises the query and database tools for real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install SuperDB
        run: |
          scripts/install-super.sh "" "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Tests that need super skip without it, so a broken install would
      # otherwise pass CI with most of the suite skipped.
      - name: Verify SuperDB version
        run: |
          want="v$(cat .superdb-version)"
          got="$(super --version)"
          echo "$got"
          case "$got" in *"$want"*) ;; *) echo "expected super $want"; exit 1 ;; esac

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
